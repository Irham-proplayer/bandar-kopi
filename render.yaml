services:
  - type: web
    name: bandar-kopi
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bandar-kopi-db
          property: connectionString
      - key: PAYMENT_PROVIDER
        value: manual_qris
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
databases:
  - name: bandar-kopi-db
    databaseName: bandar_kopi
    user: bandar_kopi
