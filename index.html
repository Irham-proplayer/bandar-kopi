<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f4e37"><meta name="description" content="Bandar Kopi — order dan operasional coffee shop"><title>Bandar Kopi V3.3</title><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui;margin:0;background:#f7f3ef;color:#241a14}.wrap{max-width:960px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#777}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{padding:11px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{background:#6f4e37;color:#fff;border:0;cursor:pointer}.price{font-weight:700}.status{font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.pill{padding:6px 10px;border-radius:99px;background:#eee;font-size:12px}.tablebox{background:#f2ebe5;border-radius:14px;padding:12px}</style></head><body><div class="wrap"><div class="top"><h1>☕ Bandar Kopi</h1><span id="live" class="pill">● offline</span></div><div id="app"></div></div><script>
const $=s=>document.querySelector(s);let me=null,products=[],tables=[],orders=[],qrTable=null,cart=[];const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const params=new URLSearchParams(location.search);const tableToken=params.get('table_token');
async function api(u,o){let r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o});let x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x}
async function init(){if(tableToken){try{const x=await api('/api/public/table?token='+encodeURIComponent(tableToken));qrTable=x.table;products=x.products;renderQR();return}catch(e){$('#app').innerHTML='<div class="card"><h2>QR meja tidak valid</h2><p>'+e.message+'</p></div>';return}}me=(await api('/api/me')).user;products=await api('/api/products');tables=await api('/api/tables');if(me)orders=await api('/api/orders');render();if(me)connect()}
function login(){return '<div class="card"><h2>Masuk Bandar Kopi</h2><p class="muted">Demo: owner/owner123 · kasir/kasir123 · barista/barista123 · customer/customer123</p><input id="user" placeholder="Username" style="width:100%"><br><br><input id="pass" type="password" placeholder="Password" style="width:100%"><br><br><button onclick="doLogin()">Masuk</button></div>'}
async function doLogin(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});init()}catch(e){alert(e.message)}}async function logout(){await api('/api/logout',{method:'POST'});location.href=location.pathname}
function render(){if(!me){$('#app').innerHTML=login();return}$('#app').innerHTML='<div class="card"><b>'+me.name+'</b> · '+me.role+'<button style="float:right" onclick="logout()">Keluar</button></div>'+(me.role==='customer'?customer():staff())}
function customer(){return '<div class="card"><h2>Menu</h2><div class="grid">'+products.map(p=>'<div class="card"><b>'+p.name+'</b><p>'+p.category+'</p><span class="price">'+money(p.price)+'</span><br><br><button onclick="add(\''+p.id+'\')">Tambah</button></div>').join('')+'</div></div><div class="card"><h2>Pesanan saya</h2>'+orders.filter(o=>o.customerId===me.id).map(order).join('')||'<p class="muted">Belum ada pesanan.</p>'+'</div>'}
function add(id){let p=products.find(x=>x.id===id);cart.push(p);if(confirm(p.name+' ditambahkan. Buka keranjang?'))checkout()}
async function checkout(){if(!cart.length)return alert('Keranjang kosong');let table=prompt('Nomor meja (contoh: Meja 01) atau Takeaway','Meja 01')||'Takeaway';let items=cart.map(p=>({productId:p.id,name:p.name,price:p.price,qty:1})),total=items.reduce((a,x)=>a+x.price*x.qty,0);try{let o=await api('/api/orders',{method:'POST',body:JSON.stringify({table,items,total,payment:'CASH'})});cart=[];orders.unshift(o);render();alert('Order '+o.id+' berhasil dibuat')}catch(e){alert(e.message)}}
function order(o){return '<div class="card"><b>'+o.id+'</b> · '+(o.table||'')+'<p>'+o.items.map(i=>i.name+' × '+i.qty).join(', ')+'</p><span class="status">'+o.status+'</span> · '+money(o.total)+'</div>'}
function staff(){let dash=me.role==='owner'?'<button onclick="dashboard()">Dashboard</button>':'';let cards=orders.map(o=>'<div class="card"><b>'+o.id+'</b> · '+(o.table||'')+'<p>'+o.items.map(i=>i.name+' × '+i.qty).join(', ')+'</p><span class="status">'+o.status+'</span> · '+money(o.total)+'<div class="row" style="margin-top:10px">'+['NEW','PROCESSING','READY','DONE'].map(st=>'<button onclick="setStatus(\''+o.id+'\',\''+st+'\')">'+st+'</button>').join('')+'</div></div>').join('');return '<div class="card"><h2>Pesanan Real-Time</h2>'+dash+'</div><div id="orders">'+(cards||'<div class="card"><p class="muted">Belum ada order.</p></div>')+'</div>'}
async function setStatus(id,status){await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})})}async function dashboard(){let d=await api('/api/dashboard');alert('Omzet selesai: '+money(d.omzet)+'\nTotal transaksi: '+d.transactions+'\nSelesai: '+d.done+'\nPending: '+d.pending)}
function connect(){let es=new EventSource('/api/events');es.onopen=()=>$('#live').textContent='● real-time';es.onerror=()=>$('#live').textContent='● reconnecting';es.addEventListener('update',async()=>{orders=await api('/api/orders');render()})}
function renderQR(){let html='<div class="card"><div class="tablebox"><h2>📍 '+qrTable.name+'</h2><p class="muted">Pesan langsung dari meja ini.</p></div><h2>Menu</h2><div class="grid">'+products.map(p=>'<div class="card"><b>'+p.name+'</b><p>'+p.category+'</p><span class="price">'+money(p.price)+'</span><br><br><button onclick="qrAdd(\''+p.id+'\')">Tambah</button></div>').join('')+'</div></div><div class="card"><h2>Keranjang</h2><div id="qcart">Keranjang kosong.</div><button onclick="qrCheckout()">Kirim Pesanan</button></div>';$(' #app'.trim()).innerHTML=html}
function qrAdd(id){let p=products.find(x=>x.id===id),x=cart.find(y=>y.id===id);if(x)x.qty++;else cart.push({...p,qty:1});$('#qcart').innerHTML=cart.map(x=>'<p>'+x.name+' × '+x.qty+' — '+money(x.price*x.qty)+'</p>').join('')}
async function qrCheckout(){if(!cart.length)return alert('Keranjang kosong');let name=prompt('Nama pemesan (opsional)','')||'Pelanggan QR';let items=cart.map(p=>({productId:p.id,name:p.name,price:p.price,qty:p.qty})),total=items.reduce((a,x)=>a+x.price*x.qty,0);try{let o=await api('/api/public/orders',{method:'POST',body:JSON.stringify({tableToken,customerName:name,items,total,payment:'CASH'})});cart=[];$('#qcart').innerHTML='<b>Pesanan '+o.id+' berhasil dikirim.</b><p>Silakan tunggu pesanan diantar/diambil.</p>';alert('Order berhasil dikirim: '+o.id)}catch(e){alert(e.message)}}init().catch(e=>{$('#app').innerHTML='<div class="card">Gagal memuat aplikasi: '+e.message+'</div>'});
</script></body></html>
